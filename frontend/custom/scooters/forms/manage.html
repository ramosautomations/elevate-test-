<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Forms</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" type="image/x-icon" href="/scooters/dashboard/favicon.ico">
    <link rel="stylesheet" href="/scooters/forms/styles.css?v=1">
    <link rel="stylesheet" href="/scooters/forms/manage.css?v=1">
</head>
<body>
<div class="form-container" style="max-width:1100px;">
    <div class="form-header">
        <img src="/images/ScooterLogo.png" alt="Scooter's Logo" class="logo">
        <h1>Manage Forms</h1>
        <p>Build and manage custom forms for your team.</p>
    </div>
    <div class="form-content">

        <div id="notAuthorized" style="display:none; text-align:center; padding:40px 0;">
            <p style="color:#666;">You don't have access to manage forms.</p>
        </div>

        <div id="listView">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 class="section-title" style="border:none; margin:0; padding:0;">Your Forms</h2>
                <button class="btn-submit" onclick="showBuilder()">+ New Form</button>
            </div>
            <div id="templatesEmpty" style="display:none; color:#888; padding:30px 0; text-align:center;">
                No custom forms yet. Click "+ New Form" to build one.
            </div>
            <table class="manage-table" id="templatesTable" style="display:none;">
                <thead><tr><th>Title</th><th>Audience</th><th>Status</th><th>Created</th><th></th></tr></thead>
                <tbody id="templatesTableBody"></tbody>
            </table>
        </div>

        <div id="builderView" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 class="section-title" style="border:none; margin:0; padding:0;" id="builderHeading">New Form</h2>
                <button class="btn-reset" onclick="cancelBuilder()">&larr; Back to list</button>
            </div>

            <div class="form-section">
                <div class="form-row single">
                    <div class="form-group">
                        <label for="tplTitle">Form Title <span class="required">*</span></label>
                        <input type="text" id="tplTitle" placeholder="e.g. Uniform Request">
                    </div>
                </div>
                <div class="form-row single">
                    <div class="form-group">
                        <label for="tplDescription">Description</label>
                        <textarea id="tplDescription" placeholder="Shown on the form card"></textarea>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3 class="section-title">Who can fill this out?</h3>
                <div class="audience-options">
                    <label class="radio-option"><input type="radio" name="audienceType" value="all" checked onchange="onAudienceChange()"> All employees</label>
                    <label class="radio-option"><input type="radio" name="audienceType" value="roles" onchange="onAudienceChange()"> Specific roles</label>
                </div>
                <div id="audienceRolesBox" style="display:none; margin-top:12px;">
                    <div class="role-checkboxes" id="roleCheckboxes"></div>
                </div>
            </div>

            <div class="form-section">
                <h3 class="section-title">Fields</h3>
                <div class="field-type-buttons">
                    <button type="button" class="btn-add-field" onclick="addField('text')">+ Text</button>
                    <button type="button" class="btn-add-field" onclick="addField('select')">+ Dropdown</button>
                    <button type="button" class="btn-add-field" onclick="addField('radio')">+ Multiple Choice</button>
                    <button type="button" class="btn-add-field" onclick="addField('checkbox')">+ Checkbox</button>
                    <button type="button" class="btn-add-field" onclick="addField('date')">+ Date</button>
                </div>
                <div id="fieldsList"></div>
                <div id="fieldsEmpty" style="color:#888; padding:16px 0;">No fields yet — add one above.</div>
            </div>

            <div class="form-section">
                <h3 class="section-title">Preview</h3>
                <div id="previewBox" class="preview-box"></div>
            </div>

            <div class="button-group">
                <button class="btn-reset" onclick="cancelBuilder()">Cancel</button>
                <button class="btn-submit" onclick="saveTemplate()">Save Form</button>
            </div>
        </div>

    </div>
</div>

<script src="/scooters/forms/shared/form-renderer.js?v=1"></script>
<script src="/scooters/forms/manage.js?v=1"></script>
</body>
</html>

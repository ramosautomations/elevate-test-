<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Offer Letter</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" type="image/x-icon" href="/scooters/dashboard/favicon.ico">
    <link rel="stylesheet" href="/scooters/forms/styles.css?v=3">
    <style>
        .job-desc-box {
            background: #fff5f5;
            border: 1px solid #fecaca;
            border-radius: 6px;
            padding: 16px;
            font-size: 13px;
            color: #444;
            line-height: 1.7;
            margin-top: 8px;
            display: none;
        }
        .job-desc-box.visible { display: block; }
        .job-desc-box h4 { color: #dc2626; font-size: 13px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .job-desc-box ul { padding-left: 18px; margin-top: 6px; }
        .job-desc-box ul li { margin-bottom: 4px; }
        .offer-preview {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 500;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .offer-preview.open { display: flex; }
        .offer-preview-inner {
            background: white;
            width: 100%;
            max-width: 750px;
            max-height: 90vh;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .offer-preview-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: #1a1a1a;
            color: white;
            gap: 12px;
        }
        .offer-preview-toolbar span { font-size: 14px; font-weight: 500; }
        .offer-preview-toolbar-btns { display: flex; gap: 8px; }
        .offer-preview-toolbar button {
            padding: 7px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-print { background: white; color: #1a1a1a; }
        .btn-download-pdf { background: #dc2626; color: white; }
        .btn-close-preview { background: #333; color: white; }
        .offer-preview-body { flex: 1; overflow-y: auto; padding: 40px; }

        /* Offer letter styles */
        .letter-header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 3px solid #dc2626; }
        .letter-logo { max-width: 120px; margin-bottom: 12px; }
        .letter-company { font-size: 22px; font-weight: 700; color: #991b1b; letter-spacing: 1px; }
        .letter-tagline { font-size: 12px; color: #888; margin-top: 2px; }
        .letter-date { text-align: right; font-size: 13px; color: #555; margin-bottom: 24px; }
        .letter-candidate { margin-bottom: 24px; }
        .letter-candidate p { font-size: 14px; line-height: 1.8; }
        .letter-body { font-size: 14px; line-height: 1.8; color: #333; }
        .letter-body p { margin-bottom: 14px; }
        .letter-body strong { color: #111; }
        .letter-terms {
            background: #f8f9fa;
            border-left: 4px solid #dc2626;
            padding: 16px 20px;
            margin: 20px 0;
            border-radius: 0 6px 6px 0;
        }
        .letter-terms table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .letter-terms td { padding: 6px 10px; }
        .letter-terms td:first-child { font-weight: 600; color: #555; width: 40%; }
        .letter-terms td:last-child { color: #111; }
        .letter-signature { margin-top: 40px; }
        .letter-signature-line { border-top: 1px solid #333; width: 200px; margin-top: 40px; margin-bottom: 4px; }
        .letter-footer { margin-top: 30px; padding-top: 16px; border-top: 1px solid #e0e0e0; font-size: 11px; color: #999; text-align: center; }
    </style>
</head>

<script>
    const FORM_NAME = 'reviews';
    const FORM_TYPE = 'job-offer';
    const FORM_TITLE = 'Job Offer Letter';
    const LANDING_URL = 'https://app.elevateerconsulting.com/scooters/forms';

    (function() {
        const params = new URLSearchParams(window.location.search);
        const pt = params.get('pt');
        if (!pt) { window.location.replace(LANDING_URL); return; }
        let decoded;
        try { decoded = atob(pt); } catch(e) { window.location.replace(LANDING_URL); return; }
        const currentWindow = Math.floor(Date.now() / 300000);
        const prevWindow = currentWindow - 1;
        const validTokens = [
            `scooters-page-${FORM_NAME}-${currentWindow}`,
            `scooters-page-${FORM_NAME}-${prevWindow}`,
            `scooters-page-reviews-${currentWindow}`,
            `scooters-page-reviews-${prevWindow}`
        ];
        if (!validTokens.includes(decoded)) { window.location.replace(LANDING_URL); return; }
        const cleanUrl = window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
    })();
</script>

<body>
    <div class="form-container">
        <div class="form-header">
            <img src="/images/ScooterLogo.png" alt="Scooters Logo" class="logo">
            <h1>Job Offer Letter</h1>
            <p>Generate and send an official employment offer.</p>
        </div>

        <div class="form-content">
            <form id="offerForm">

                <!-- Candidate Information -->
                <div class="form-section">
                    <h2 class="section-title">Candidate Information</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="candidateName">Candidate Full Name <span class="required">*</span></label>
                            <input type="text" id="candidateName" name="candidateName" placeholder="Jane Smith" required>
                        </div>
                        <div class="form-group">
                            <label for="candidateEmail">Candidate Email</label>
                            <input type="text" id="candidateEmail" name="candidateEmail" placeholder="jane.smith@email.com">
                        </div>
                    </div>
                </div>

                <!-- Position Details -->
                <div class="form-section">
                    <h2 class="section-title">Position Details</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="position">Position <span class="required">*</span></label>
                            <select id="position" name="position" required onchange="showJobDesc(this.value)">
                                <option value="">Select position...</option>
                                <option value="Barista">Barista</option>
                                <option value="Shift Lead">Shift Lead</option>
                                <option value="Assistant Manager">Assistant Manager</option>
                                <option value="Store Manager">Store Manager</option>
                                <option value="District Manager">District Manager</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="location">Location <span class="required">*</span></label>
                            <select id="location" name="location" required disabled>
                                <option value="">Loading...</option>
                            </select>
                            <input type="hidden" id="locationHidden" name="locationHidden">
                        </div>
                    </div>

                    <!-- Job Description Box -->
                    <div class="form-row single">
                        <div id="jobDescBox" class="job-desc-box"></div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="startDate">Start Date <span class="required">*</span></label>
                            <input type="date" id="startDate" name="startDate" required>
                        </div>
                        <div class="form-group">
                            <label for="hoursPerWeek">Hours Per Week <span class="required">*</span></label>
                            <select id="hoursPerWeek" name="hoursPerWeek" required>
                                <option value="">Select hours...</option>
                                <option value="10-15 hours">10–15 hours (Part-Time)</option>
                                <option value="15-20 hours">15–20 hours (Part-Time)</option>
                                <option value="20-25 hours">20–25 hours (Part-Time)</option>
                                <option value="25-30 hours">25–30 hours (Part-Time)</option>
                                <option value="30-35 hours">30–35 hours (Full-Time)</option>
                                <option value="35-40 hours">35–40 hours (Full-Time)</option>
                                <option value="40+ hours">40+ hours (Full-Time)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Compensation -->
                <div class="form-section">
                    <h2 class="section-title">Compensation & Benefits</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="payType">Pay Type <span class="required">*</span></label>
                            <select id="payType" name="payType" required>
                                <option value="">Select pay type...</option>
                                <option value="Hourly">Hourly</option>
                                <option value="Salary">Salary</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="payAmount">Pay Amount <span class="required">*</span></label>
                            <input type="text" id="payAmount" name="payAmount" placeholder="e.g. $15.00/hr or $45,000/yr" required>
                        </div>
                    </div>
                    <div class="form-row single">
                        <div class="form-group">
                            <label for="benefits">Benefits</label>
                            <textarea id="benefits" name="benefits" placeholder="e.g. Free drinks on shift, flexible scheduling, growth opportunities, team events..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Offer Details -->
                <div class="form-section">
                    <h2 class="section-title">Offer Details</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="hiringManager">Hiring Manager <span class="required">*</span></label>
                            <input type="text" id="hiringManager" name="hiringManager" placeholder="Manager name" required>
                        </div>
                        <div class="form-group">
                            <label for="offerExpiry">Offer Valid Until <span class="required">*</span></label>
                            <input type="date" id="offerExpiry" name="offerExpiry" required>
                        </div>
                    </div>
                    <div class="form-row single">
                        <div class="form-group">
                            <label for="additionalNotes">Additional Notes <span style="font-weight:400; color:#888;">(optional)</span></label>
                            <textarea id="additionalNotes" name="additionalNotes" placeholder="Any additional conditions, notes, or contingencies..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="button-group">
                    <button type="reset" class="btn-reset" onclick="resetForm()">Clear Form</button>
                    <button type="button" class="btn-submit" onclick="previewOffer()">Preview & Generate Letter</button>
                </div>

            </form>
        </div>
    </div>

    <!-- OFFER LETTER PREVIEW MODAL -->
    <div class="offer-preview" id="offerPreview">
        <div class="offer-preview-inner">
            <div class="offer-preview-toolbar">
                <span>Offer Letter Preview</span>
                <div class="offer-preview-toolbar-btns">
                    <button class="btn-print" onclick="printLetter()">🖨️ Print</button>
                    <button class="btn-download-pdf" onclick="submitAndDownload()">💾 Save & Download PDF</button>
                    <button class="btn-close-preview" onclick="closePreview()">✕ Close</button>
                </div>
            </div>
            <div class="offer-preview-body" id="offerLetterContent"></div>
        </div>
    </div>

    <script>
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('startDate').value = today;

        // Set offer expiry to 7 days from now
        const expiry = new Date();
        expiry.setDate(expiry.getDate() + 7);
        document.getElementById('offerExpiry').value = expiry.toISOString().split('T')[0];
    </script>

    <script>
        const JOB_DESCRIPTIONS = {

                    'Handle escalated customer issues with professionalism',
                    'Support hiring, onboarding, and training initiatives',
                ],
                requirements: [
                    '2+ years of food service or retail management experience',
                    'Strong leadership and people development skills',
                    'Excellent communication and problem-solving abilities',

                    'Passion for building great teams and customer experiences',

            },

                description: 'The Store Manager is responsible for all aspects of store performance — from team development and customer experience to financial results and operational excellence.',
                responsibilities: [

                    'Drive sales, manage costs, and achieve financial targets',

                    'Manage hiring, scheduling, training, and performance reviews',

            },
            'District Manager': {

                responsibilities: [
                    'Oversee operations across multiple store locations',
                    'Coach and develop Store Managers to achieve performance goals',
                    'Drive district-wide sales, profitability, and brand standards',
                    'Conduct regular store visits, audits, and performance reviews',
                    'Lead hiring, succession planning, and talent development',
                    'Collaborate with corporate leadership on strategy and initiatives',
                ],
                requirements: [
                    '5+ years of multi-unit food service or retail management',

                    'Strong analytical, financial, and strategic planning skills',
                    'Excellent communication and relationship-building abilities',
                    'Valid driver\'s license and ability to travel between locations',
                ]

        };

        function showJobDesc(position) {
            const box = document.getElementById('jobDescBox');
            if (!position || !JOB_DESCRIPTIONS[position]) {
                box.classList.remove('visible');
                box.innerHTML = '';
                return;
            }
            const job = JOB_DESCRIPTIONS[position];
            box.innerHTML = `
                <h4>About the Role</h4>
                <p>${job.description}</p>
                <h4 style="margin-top:12px;">Key Responsibilities</h4>
                <ul>${job.responsibilities.map(r => `<li>${r}</li>`).join('')}</ul>
                <h4 style="margin-top:12px;">Requirements</h4>
                <ul>${job.requirements.map(r => `<li>${r}</li>`).join('')}</ul>
            `;
            box.classList.add('visible');
        }

        function resetForm() {
            document.getElementById('jobDescBox').classList.remove('visible');
            document.getElementById('jobDescBox').innerHTML = '';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function buildLetterHTML(data) {
            const job = JOB_DESCRIPTIONS[data.position] || {};
            const responsibilities = job.responsibilities || [];
            const requirements = job.requirements || [];

            return `
                <div class="letter-header">
                    <img src="/images/ScooterLogo.png" class="letter-logo" alt="Scooters Coffee">
                    <div class="letter-company">SCOOTERS COFFEE</div>
                    <div class="letter-tagline">Employee Portal — Official Offer of Employment</div>
                </div>

                <div class="letter-date">${formatDate(new Date().toISOString().split('T')[0])}</div>

                <div class="letter-candidate">
                    <p><strong>${data.candidateName}</strong></p>
                    ${data.candidateEmail ? `<p>${data.candidateEmail}</p>` : ''}
                </div>

                <div class="letter-body">
                    <p>Dear <strong>${data.candidateName}</strong>,</p>

                    <p>On behalf of the entire Scooters Coffee team, we are thrilled to extend this official offer of employment for the position of <strong>${data.position}</strong> at our <strong>${data.location}</strong> location.</p>

                    <p>We were impressed by your enthusiasm and believe you will be a fantastic addition to our team. Scooters Coffee is built on a culture of love, integrity, humility, and courage — and we look forward to having you live out those values with us every day.</p>

                    <div class="letter-terms">
                        <table>
                            <tr><td>Position</td><td><strong>${data.position}</strong></td></tr>
                            <tr><td>Location</td><td>${data.location}</td></tr>
                            <tr><td>Start Date</td><td>${formatDate(data.startDate)}</td></tr>
                            <tr><td>Hours Per Week</td><td>${data.hoursPerWeek}</td></tr>
                            <tr><td>Pay Type</td><td>${data.payType}</td></tr>
                            <tr><td>Compensation</td><td><strong>${data.payAmount}</strong></td></tr>
                            ${data.benefits ? `<tr><td>Benefits</td><td>${data.benefits}</td></tr>` : ''}
                            <tr><td>Offer Valid Until</td><td>${formatDate(data.offerExpiry)}</td></tr>
                        </table>
                    </div>

                    ${responsibilities.length ? `
                    <p><strong>In this role, you will:</strong></p>
                    <ul style="padding-left:20px; margin-bottom:14px;">
                        ${responsibilities.map(r => `<li style="margin-bottom:4px;">${r}</li>`).join('')}
                    </ul>` : ''}

                    ${data.additionalNotes ? `<p><strong>Additional Notes:</strong> ${data.additionalNotes}</p>` : ''}

                    <p>This offer is contingent upon the successful completion of any required pre-employment screenings. Please review this letter carefully and indicate your acceptance by signing below and returning it by <strong>${formatDate(data.offerExpiry)}</strong>.</p>

                    <p>We are so excited to welcome you to the Scooters family. If you have any questions, please don't hesitate to reach out.</p>

                    <p>Warmly,</p>
                </div>

                <div class="letter-signature">
                    <div class="letter-signature-line"></div>
                    <p><strong>${data.hiringManager}</strong></p>
                    <p style="color:#666; font-size:13px;">Hiring Manager — Scooters Coffee, ${data.location}</p>
                </div>

                <div style="margin-top:50px;">
                    <p style="font-size:14px; font-weight:600; margin-bottom:8px;">Candidate Acceptance</p>
                    <p style="font-size:13px; color:#555; margin-bottom:30px;">By signing below, I, <strong>${data.candidateName}</strong>, accept the offer of employment as outlined above.</p>
                    <div class="letter-signature-line"></div>
                    <p style="font-size:13px; color:#555;">Signature &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Date</p>
                </div>

                <div class="letter-footer">
                    Scooters Coffee · ${data.location} · This document is confidential and intended solely for the named recipient.
                </div>
            `;
        }

        function previewOffer() {
            const form = document.getElementById('offerForm');
            if (!form.checkValidity()) { form.reportValidity(); return; }

            const data = {
                candidateName:  document.getElementById('candidateName').value,
                candidateEmail: document.getElementById('candidateEmail').value,
                position:       document.getElementById('position').value,
                location:       document.getElementById('locationHidden').value || document.getElementById('location').value,
                startDate:      document.getElementById('startDate').value,
                hoursPerWeek:   document.getElementById('hoursPerWeek').value,
                payType:        document.getElementById('payType').value,
                payAmount:      document.getElementById('payAmount').value,
                benefits:       document.getElementById('benefits').value,
                hiringManager:  document.getElementById('hiringManager').value,
                offerExpiry:    document.getElementById('offerExpiry').value,
                additionalNotes:document.getElementById('additionalNotes').value,
            };

            document.getElementById('offerLetterContent').innerHTML = buildLetterHTML(data);
            document.getElementById('offerPreview').classList.add('open');
            window._offerData = data;
        }

        function closePreview() {
            document.getElementById('offerPreview').classList.remove('open');
        }

        function printLetter() {
            const content = document.getElementById('offerLetterContent').innerHTML;
            const win = window.open('', '_blank');
            win.document.write(`<!DOCTYPE html><html><head><title>Offer Letter</title>
            <style>
                body { font-family: Arial, sans-serif; padding: 40px; color: #222; max-width: 750px; margin: 0 auto; }
                .letter-header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 3px solid #dc2626; }
                .letter-logo { max-width: 100px; margin-bottom: 10px; }
                .letter-company { font-size: 20px; font-weight: 700; color: #991b1b; letter-spacing: 1px; }
                .letter-tagline { font-size: 11px; color: #888; }
                .letter-date { text-align: right; font-size: 13px; color: #555; margin-bottom: 20px; }
                .letter-body { font-size: 14px; line-height: 1.8; color: #333; }
                .letter-body p { margin-bottom: 12px; }
                .letter-terms { background: #f8f9fa; border-left: 4px solid #dc2626; padding: 14px 18px; margin: 16px 0; }
                .letter-terms table { width: 100%; border-collapse: collapse; font-size: 13px; }
                .letter-terms td { padding: 5px 8px; }
                .letter-terms td:first-child { font-weight: 600; color: #555; width: 40%; }
                .letter-signature-line { border-top: 1px solid #333; width: 200px; margin-top: 40px; margin-bottom: 4px; }
                .letter-footer { margin-top: 30px; padding-top: 14px; border-top: 1px solid #e0e0e0; font-size: 11px; color: #999; text-align: center; }
                ul { padding-left: 20px; margin-bottom: 12px; }
                ul li { margin-bottom: 3px; }
            </style></head><body>${content}</body></html>`);
            win.document.close();
            win.focus();
            setTimeout(() => win.print(), 500);
        }

        async function submitAndDownload() {
            const data = window._offerData;
            if (!data) return;

            const btn = document.querySelector('.btn-download-pdf');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            try {
                const res = await fetch('/api/forms/submit', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        form_type: FORM_TYPE,
                        form_title: FORM_TITLE,
                        employee_name: data.candidateName,
                        location: data.location,
                        form_data: data
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    alert('Error: ' + (err.error || 'Failed to save'));
                    btn.disabled = false;
                    btn.textContent = '💾 Save & Download PDF';
                    return;
                }

                const result = await res.json();

                if (result.pdf_filename) {
                    // Download the PDF
                    const a = document.createElement('a');
                    a.href = `/api/forms/pdf/${result.pdf_filename}`;
                    a.download = `offer-letter-${data.candidateName.replace(/\s+/g,'-')}.pdf`;
                    a.click();
                }

                btn.textContent = '✅ Saved!';
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = '💾 Save & Download PDF';
                }, 3000);

            } catch (err) {
                console.error('Submit error:', err);
                alert('Something went wrong. Please try again.');
                btn.disabled = false;
                btn.textContent = '💾 Save & Download PDF';
            }
        }
    </script>

    <script>
        async function loadEmployees(location) {
            const managerInput = document.getElementById('hiringManager');
            if (!managerInput) return;
            try {
                const res = await fetch('/api/employees', { credentials: 'include' });
                if (!res.ok) return;
                let employees = await res.json();
                if (location) employees = employees.filter(e => e.location === location);
                const managers = employees.filter(e =>
                    e.status === 'Active' || e.status === 'active' &&
                    ['store manager','assistant manager','district manager'].some(t => (e.title||'').toLowerCase().includes(t))
                );
                if (managers.length === 1) {
                    managerInput.value = managers[0].name;
                }
            } catch(err) {
                console.error('Error loading manager:', err);
            }
        }

        (async function() {
            try {
                const response = await fetch('/auth/current-user', { credentials: 'include' });
                if (!response.ok) return;
                const userData = await response.json();

                const locationSelect = document.getElementById('location');
                const locationHidden = document.getElementById('locationHidden');
                locationSelect.innerHTML = '';
                let currentLocation = '';

                if (userData.is_admin) {
                    locationSelect.disabled = false;
                    locationSelect.innerHTML = `
                        <option value="">Select location...</option>
                        <option value="Iowa Falls">Iowa Falls</option>
                        <option value="Webster City">Webster City</option>
                        <option value="Elkhorn">Elkhorn</option>
                    `;
                    locationSelect.addEventListener('change', function() {
                        locationHidden.value = this.value;
                        currentLocation = this.value;
                        loadEmployees(currentLocation);
                    });
                } else {
                    currentLocation = userData.location || '';
                    locationSelect.disabled = true;
                    locationSelect.innerHTML = `<option value="${currentLocation}">${currentLocation}</option>`;
                    locationHidden.value = currentLocation;
                }

                await loadEmployees(currentLocation);

            } catch (error) {
                console.error('Error loading user data:', error);
            }
        })();
    </script>
</body>
</html>

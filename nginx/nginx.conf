events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream elevate_api {
        server elevate-api:3000;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        client_max_body_size 10M;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://elevate_api;
            proxy_set_header Host $host;
        }

        location /auth/ {
            proxy_pass http://elevate_api;
            proxy_set_header Host $host;
        }

        # Scooters - rewrite to custom/scooters
        location /scooters/ {
            rewrite ^/scooters/(.*)$ /custom/scooters/$1 last;
        }

        # Standard dashboard - rewrite to standard/dashboard
        location /dashboard/ {
            rewrite ^/dashboard/(.*)$ /standard/dashboard/$1 last;
        }

        # Root location - try file, then directory with index, then login
        location / {
            try_files $uri $uri/index.html =404;
        }

        # Explicit login page
        location = / {
            try_files /login/index.html =404;
        }

        location /health {
            return 200 "healthy\n";
        }
    }
}
